[project]
name = "graphtorch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "torch>=2.9.1",
    "torch-geometric>=2.7.0",
    "uproot>=5.6.8",
]

[project.scripts]
graphtorch-dataset = "graphtorch.dataset:main"
graphtorch-train = "graphtorch.train:main"
graphtorch-evaluate = "graphtorch.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphtorch"]
